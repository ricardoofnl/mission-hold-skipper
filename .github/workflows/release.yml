name: release

on:
  workflow_dispatch:
    inputs:
      version:
        description: "version to release, for example 0.2.0"
        required: true
        type: string
      prerelease:
        description: "mark the release as a prerelease"
        required: false
        default: false
        type: boolean

permissions:
  contents: write

jobs:
  release:
    runs-on: windows-2022

    steps:
      - uses: actions/checkout@v4

      # never interpolate the input straight into a shell line
      - name: resolve the version
        id: version
        shell: bash
        env:
          INPUT_VERSION: ${{ inputs.version }}
        run: |
          version="${INPUT_VERSION#v}"
          if ! [[ "$version" =~ ^[0-9]+\.[0-9]+\.[0-9]+$ ]]; then
            echo "expected X.Y.Z, got '$INPUT_VERSION'" >&2
            exit 1
          fi
          echo "version=$version" >> "$GITHUB_OUTPUT"
          echo "tag=v$version" >> "$GITHUB_OUTPUT"

      - name: refuse to reuse a tag
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ steps.version.outputs.tag }}
        run: |
          if gh release view "$TAG" >/dev/null 2>&1; then
            echo "release $TAG already exists" >&2
            exit 1
          fi

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: install conan and ninja
        run: pip install conan ninja

      - name: detect the build profile
        run: conan profile detect --force

      - uses: ilammy/msvc-dev-cmd@v1
        with:
          arch: x86

      - name: conan install
        run: conan install . -pr:h=./conanprofile-windows.txt -pr:b=default --build=missing -of build

      - name: configure
        run: cmake --preset conan-release -DMHS_BUILD_TESTS=ON -DMHS_VERSION=${{ steps.version.outputs.version }}

      - name: build
        run: cmake --build --preset conan-release

      - name: test
        run: ctest --test-dir build/build/Release --output-on-failure

      - name: package
        shell: pwsh
        env:
          TAG: ${{ steps.version.outputs.tag }}
        run: |
          New-Item -ItemType Directory -Path package | Out-Null
          Copy-Item build/build/Release/MissionHoldSkipper.asi package/
          Copy-Item MissionHoldSkipper.ini package/
          Copy-Item INSTALLATION.txt package/
          Copy-Item README.md package/
          Copy-Item LICENSE package/
          Compress-Archive -Path package/* -DestinationPath "MissionHoldSkipper-$env:TAG.zip"

      - name: create the release
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ steps.version.outputs.tag }}
          PRERELEASE: ${{ inputs.prerelease }}
        run: |
          notes="Drop \`MissionHoldSkipper.asi\` and \`MissionHoldSkipper.ini\` next to \`gta_sa.exe\`."
          notes="$notes Needs GTA San Andreas v1.0 US and an ASI loader."
          flags=(--title "$TAG" --notes "$notes" --target "$GITHUB_SHA")
          if [ "$PRERELEASE" = "true" ]; then
            flags+=(--prerelease)
          fi
          gh release create "$TAG" "MissionHoldSkipper-$TAG.zip" "${flags[@]}"