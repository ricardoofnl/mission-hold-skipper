[MissionHoldSkipper]
; master switch, 0 leaves the game untouched
Enabled=1

; how long the key has to be held, in milliseconds
HoldMs=1200

; ENTER, NUMPAD_ENTER, SPACE, MOUSE_LEFT (comma separated)
Keys=ENTER,NUMPAD_ENTER,MOUSE_LEFT

; 0 means the prompt only shows while a key is actually held
ShowHintBeforeHold=0
Label=HOLD ENTER TO SKIP

; show and hide easing, milliseconds
FadeInMs=140
FadeOutMs=220

; placement in 640x448 units, -1 puts it in the bottom right corner
RingX=-1
RingY=-1
RingRadius=13
RingThickness=2.5
RingSegments=48

; label size, x is the character width and y the height
LabelScaleX=0.28
LabelScaleY=0.7

; RRGGBBAA. backdrop is the plain black circle, progress is the white fill
; that sweeps around its rim while the key is held. track is the unfilled part
; of the rim, alpha 00 keeps it invisible
ColorBackdrop=000000C8
ColorTrack=FFFFFF00
ColorProgress=FFFFFFFF

; debug, info, warn, error
LogLevel=info