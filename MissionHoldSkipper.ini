[MissionHoldSkipper]
; master switch, 0 leaves the game untouched
Enabled=1

; how long the key has to be held, in milliseconds
HoldMs=1200

; ENTER, NUMPAD_ENTER, SPACE, MOUSE_LEFT, and any of
; PAD_CROSS, PAD_CIRCLE, PAD_SQUARE, PAD_TRIANGLE, PAD_L1, PAD_L2, PAD_R1, PAD_R2
Keys=ENTER,NUMPAD_ENTER,MOUSE_LEFT,PAD_CROSS

; 0 means the prompt only shows while a key is actually held
ShowHintBeforeHold=0

; Label is used for keyboard and mouse, LabelPad when a gamepad was used last.
; On a pad the button itself is drawn as an icon inside the ring, so LabelPad
; does not need to name it. Leave LabelPad empty to always use Label.
Label=HOLD ENTER TO SKIP
LabelPad=HOLD TO SKIP

; auto, keyboard, pad. auto follows the device you last touched
PromptDevice=auto

; The icon comes from GInput's button textures in the models folder. auto draws
; it whenever those files are there, off keeps the prompt text only.
; PadIconStyle auto follows GInput's own PlayStationButtons setting.
PadIconMode=auto
PadIconStyle=auto
PadIconScale=1.5

; show and hide easing, milliseconds
FadeInMs=140
FadeOutMs=220

; placement in 640x448 units, -1 puts it in the bottom right corner
RingX=-1
RingY=-1
RingRadius=18
RingThickness=2.5
RingSegments=48

; label size, x is the character width and y the height
LabelScaleX=0.28
LabelScaleY=0.7

; RRGGBBAA. backdrop is the plain black circle, progress is the white fill
; that sweeps around its rim while the key is held. track is the unfilled part
; of the rim, alpha 00 keeps it invisible
ColorBackdrop=000000C8
ColorTrack=FFFFFF00
ColorProgress=FFFFFFFF

; debug, info, warn, error
LogLevel=info